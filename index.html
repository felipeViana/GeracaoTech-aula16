<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 16 - Cypress</title>
</head>
<body>
    <h1>
        Programa de Saudações
    </h1>
    <p>Digite o seu nome e clique em Enviar.</p>
    <form id="formulario">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" data-cy="nome">
        <button data-cy="enviar">
            Enviar
        </button>
    </form>
    <p id="resposta" data-cy="resposta"></p>

    <script src="./script.js"></script>
</body>
</html>
